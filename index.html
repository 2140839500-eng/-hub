<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个轻盈、好用的待办清单" />
    <title>今日待办</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="todo-app" aria-labelledby="page-title">
        <header class="app-header">
          <div>
            <p class="eyebrow">PERSONAL SPACE / <span id="today"></span></p>
            <h1 id="page-title">今日待办<span class="title-dot">.</span></h1>
            <p class="subtitle" id="status-message" aria-live="polite">把想做的事，一件件完成。</p>
          </div>
          <div class="sun-mark" aria-hidden="true">✦</div>
        </header>
        <form class="task-form" id="task-form">
          <label class="sr-only" for="task-input">输入新的任务</label>
          <input id="task-input" name="task" type="text" maxlength="120" autocomplete="off" placeholder="接下来要做什么？" />
          <button type="submit">添加 <span aria-hidden="true">↗</span></button>
        </form>
        <nav class="filters" aria-label="任务筛选">
          <button class="filter is-active" type="button" data-filter="all">全部 <span id="all-count">0</span></button>
          <button class="filter" type="button" data-filter="active">未完成 <span id="active-count">0</span></button>
          <button class="filter" type="button" data-filter="completed">已完成 <span id="completed-count">0</span></button>
        </nav>
        <div class="task-list" id="task-list" aria-live="polite"></div>
        <div class="empty-state" id="empty-state" hidden><span aria-hidden="true">☼</span><p>这里还空着，先写下第一件事吧。</p></div>
        <footer class="app-footer">
          <span id="remaining-label">0 项待完成</span>
          <button class="clear-button" id="clear-completed" type="button">清除已完成</button>
        </footer>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
